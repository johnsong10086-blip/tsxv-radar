];

var SIGS = ["突破20日均线","突破50日均线","MACD金叉","RSI从超卖区反弹","布林带下轨反弹","成交量放大","成交量异动","异常大单买入","W底形态","杯柄形态突破","价格突破盘整区间","KDJ金叉","均线多头排列","强势整理后上攻","头肩底确认"];
var CATS = {
  "矿业":["钻探结果显示高品位矿化","新发现矿脉延伸至深部","完成资源量更新估算","与大型矿企签署合作意向书","获得新探矿权许可证"],
  "科技":["获得政府数字化转型合同","新产品进入测试阶段","专利获批保护核心技术","季度收入超预期增长","与上市公司达成战略合作"],
  "能源":["油井测试结果超出预期","获得联邦清洁能源补贴","天然气储量大幅上修","勘探区块发现新储层","与电网签署购电协议"],
  "大麻":["获准进入新省份零售市场","推出高利润自有品牌","季度毛利率大幅提升","与合作伙伴洽谈授权","出口许可证审批通过"],
};
var SC = {"矿业":"#f59e0b","科技":"#3b82f6","能源":"#10b981","大麻":"#8b5cf6","金融":"#ec4899","农业":"#84cc16","医疗":"#06b6d4"};
var RC = {low:"#10b981",medium:"#f59e0b",high:"#ef4444"};
var RL = {low:"低风险",medium:"中风险",high:"高风险"};

var allStocks=[], curFilter="all", curSort="signal", URLS=[];

function rng(seed){ var s=seed; return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function sc(sec){ for(var k in SC){ if(sec.indexOf(k)>=0) return SC[k]; } return "#94a3b8"; }

function addSignals(stock, meta) {
  var d = new Date();
  var seed = d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate() + meta.t.charCodeAt(0)*7;
  var r = rng(seed);

  // Signal strength based on real price change + volume
  var sig = 5;
  var chgAbs = Math.abs(stock.chg);
  if(chgAbs > 8) sig += 3;
  else if(chgAbs > 4) sig += 2;
  else if(chgAbs > 1.5) sig += 1;
  if(stock.chg > 0) sig += 1;
  sig = Math.min(10, Math.max(1, sig));

  var sigArr = SIGS.slice().sort(function(){return r()-0.5;}).slice(0,3);
  var cats = CATS[meta.s] || CATS["矿业"];
  var cat = cats[Math.floor(r()*cats.length)];
  var up = r()*0.35 + 0.12;
  var dn = r()*0.10 + 0.05;

  stock.sig = sig;
  stock.signals = sigArr;
  stock.cat = cat;
  stock.tp = Math.round(stock.price*(1+up)*1000)/1000;
  stock.sl = Math.round(stock.price*(1-dn)*1000)/1000;
  stock.risk = meta.r;
  stock.sector = meta.s;
  stock.name = meta.n;
  return stock;
}

var lastApiCall = 0;
var batch = 0;

function generateSimulated(offset) {
  var d = new Date();
  var seed = d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()+offset*97;
  var r = rng(seed);
  var arr = UNI.slice().sort(function(){return r()-0.5;}).slice(0,10);
  var stocks = arr.map(function(meta){
    var price = (r()*4.5+0.05);
    var chg = (r()*18+2)*(r()>0.2?1:-1);
    var stock = {ticker:meta.t, price:Math.round(price*1000)/1000, chg:Math.round(chg*10)/10, vol:Math.round((r()*4+1.5)*10)/10, isLive:false};
    return addSignals(stock, meta);
  });
  stocks.sort(function(a,b){return b.sig-a.sig;});
  return stocks;
}

async function tryFetchLive() {
  var now = Date.now();
  if(now - lastApiCall < 60000) return null;
  lastApiCall = now;
  try {
    // Use FMP API - TSX symbols use .TO suffix
    var symbols = UNI.slice(0,8).map(function(u){return u.t.replace(".V",".TO");});
    var url = "https://financialmodelingprep.com/api/v3/quote/"+symbols.join(",")+
      "?apikey="+FMP_KEY;
    var resp = await fetch(url, {signal: AbortSignal.timeout(8000)});
    if(!resp.ok) return null;
    var data = await resp.json();
    if(!Array.isArray(data) || data.length===0) return null;
    var results = {};
    data.forEach(function(q){ results[q.symbol] = q; });
    var scored = [];
    UNI.slice(0,8).forEach(function(meta){
      var key = meta.t.replace(".V",".TO");
      var q = results[key];
      if(q && q.price && q.price > 0){
        var price = q.price;
        var chg = q.changesPercentage ? Math.round(q.changesPercentage*10)/10 : 0;
        var vol = (q.volume && q.avgVolume && q.avgVolume>0) ?
          Math.round(q.volume/q.avgVolume*10)/10 : 1.0;
        scored.push(addSignals({ticker:meta.t,price:price,chg:chg,vol:vol,isLive:true},meta));
      }
    });
    if(scored.length===0) return null;
    scored.sort(function(a,b){return b.sig-a.sig;});
    return scored.slice(0,10);
  } catch(e){ return null; }
}

async function loadData() {
  var btn = document.getElementById("rbtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>正在加载...';
  document.getElementById("status").textContent = "尝试获取实时数据...";

  batch++;
  var liveStocks = await tryFetchLive();
  if(liveStocks) {
    allStocks = liveStocks;
    document.getElementById("status").textContent = "✅ 实时行情已加载";
  } else {
    allStocks = generateSimulated(batch);
    document.getElementById("status").textContent = "📊 模拟数据（实时数据暂不可用）";
  }

  var avgChg = allStocks.reduce(function(s,x){return s+x.chg;},0)/allStocks.length;
  var sc2,sl,sn;
  if(avgChg>1.5){sc2="#34d399";sl="看多";sn="创业板整体偏多，多支个股出现放量上涨信号";}
  else if(avgChg<-1.5){sc2="#f87171";sl="看空";sn="市场情绪偏谨慎，多支个股承压，注意控制风险";}
  else{sc2="#fbbf24";sl="中性";sn="市场方向不明，个股行情分化，精选个股机会";}

  document.getElementById("sdot").style.cssText="width:8px;height:8px;border-radius:50%;display:inline-block;background:"+sc2+";box-shadow:0 0 8px "+sc2;
  document.getElementById("slabel").style.color=sc2;
  document.getElementById("slabel").textContent=sl;
  document.getElementById("snote").textContent=sn;
  var now=new Date();
  document.getElementById("cr").textContent=now.toLocaleDateString("zh-CN")+" "+now.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});

  renderCards();
  btn.disabled=false;
  btn.innerHTML="🔄 刷新行情";
}

function renderCards(){
  var stocks = allStocks.filter(function(s){ return curFilter==="all"||s.risk===curFilter; });
  stocks.sort(function(a,b){
    if(curSort==="signal") return b.sig-a.sig;
    if(curSort==="change") return b.chg-a.chg;
    if(curSort==="volume") return b.vol-a.vol;
    return 0;
  });
  URLS = [];
  var html = "";
  for(var i=0;i<stocks.length;i++){
    var s = stocks[i];
    var color = sc(s.sector);
    var rc = RC[s.risk];
    var isUp = s.chg >= 0;
    var code = s.ticker.replace(/\.V$/i,"");
    URLS.push("https://www.moomoo.com/stock/"+code+"-CA");
    var bars = "";
    for(var b=0;b<10;b++){
      var ht=b<5?12:18;
      var bg=b<s.sig?"hsl("+(120-(s.sig-1)*12)+",80%,50%)":"rgba(255,255,255,0.1)";
      bars+='<div class="sigbar" style="height:'+ht+'px;background:'+bg+'"></div>';
    }
    var tags = s.signals.map(function(x){return '<span class="sigtag">📊 '+x+'</span>';}).join("");
    html += '<div class="card" id="c'+i+'" style="border-left:3px solid '+color+'" onclick="tog('+i+')">'
      +'<div style="position:absolute;top:0;right:0;width:120px;height:120px;border-radius:50%;transform:translate(40%,-40%);background:radial-gradient(circle,'+color+'22 0%,transparent 70%);pointer-events:none"></div>'
      +'<div class="card-top">'
        +'<div>'
          +'<div><span class="ticker">'+s.ticker+'</span><span class="sbadge" style="background:'+color+'28;color:'+color+'">'+s.sector+'</span></div>'
          +'<div class="coname">'+s.name+'</div>'
        +'</div>'
        +'<div class="pricecol">'
          +'<div style="display:flex;align-items:center;gap:6px">'
            +'<div class="price">$'+s.price.toFixed(3)+'</div>'
            +(s.isLive?'<span class="live-tag">LIVE</span>':'')
          +'</div>'
          +'<div class="chg" style="color:'+(isUp?"#34d399":"#f87171")+'">'+(isUp?"▲":"▼")+' '+Math.abs(s.chg).toFixed(1)+'%</div>'
          +'<button class="mbtn" onclick="event.stopPropagation();go('+i+')">🔗 Moomoo</button>'
        +'</div>'
      +'</div>'
      +'<div class="sigrow"><div class="sigbars">'+bars+'</div>'
        +'<div class="badges">'
          +'<span class="rbadge" style="background:'+rc+'20;color:'+rc+';border:1px solid '+rc+'40">'+RL[s.risk]+'</span>'
        +'</div>'
      +'</div>'
      +'<div class="catalyst">💡 '+s.cat+'</div>'
      +'<div class="detail" id="d'+i+'">'
        +'<div class="sigtags">'+tags+'</div>'
        +'<div class="stats">'
          +'<div><div class="slabel">目标价</div><div class="sval" style="color:#34d399">$'+s.tp.toFixed(3)+'</div></div>'
          +'<div><div class="slabel">止损价</div><div class="sval" style="color:#f87171">$'+s.sl.toFixed(3)+'</div></div>'
          +'<div><div class="slabel">信号强度</div><div class="sval" style="color:#fbbf24">'+s.sig+'/10</div></div>'
        +'</div>'
        +'<div class="btnrow">'
          +'<button class="cbtn" onclick="event.stopPropagation();cp(this,\''+s.ticker+'\')">📋 复制</button>'
          +'<button class="mbtn2" onclick="event.stopPropagation();go('+i+')">🔗 Moomoo 完整行情 →</button>'
        +'</div>'
      +'</div>'
    +'</div>';
  }
  document.getElementById("cards").innerHTML = html;
  document.getElementById("cl").innerHTML = "共 "+stocks.length+" 支 · 点击展开详情";
  setTimeout(function(){
    document.querySelectorAll(".card").forEach(function(c,i){
      setTimeout(function(){ c.classList.add("vis"); }, i*60);
    });
  }, 30);
}

function tog(i){ document.getElementById("d"+i).classList.toggle("open"); }
function setFilter(v,btn){ curFilter=v; document.querySelectorAll(".fbtn").forEach(function(b){b.classList.remove("on");}); btn.classList.add("on"); renderCards(); }
function setSort(v){ curSort=v; renderCards(); }
function go(i){ if(URLS[i]) window.open(URLS[i],"_blank"); }
function cp(btn,ticker){
  var code=ticker.replace(/\.V$/i,"");
  if(navigator.clipboard){
    navigator.clipboard.writeText(code).then(function(){ btn.textContent="✅ 已复制"; setTimeout(function(){btn.textContent="📋 复制";},2000); });
  } else {
    var ta=document.createElement("textarea"); ta.value=code; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    btn.textContent="✅ 已复制"; setTimeout(function(){btn.textContent="📋 复制";},2000);
  }
}

loadData();
</script>
